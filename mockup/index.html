const deck = document.querySelector('.deck');
function bind() {
  document.querySelectorAll('.key:not([disabled])').forEach((k) => {
    k.addEventListener('click', () => {
      k.classList.add('is-sent');
      setTimeout(() => k.classList.remove('is-sent'), 1300);
    });
  });
}
document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => {
  const v = VIEWS[b.dataset.view];
  document.getElementById('keys').innerHTML = v.keys;
  document.getElementById('strip').innerHTML = v.strip;
  deck.dataset.link = v.link;
  document.querySelectorAll('[data-view]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  bind();
}));
document.querySelectorAll('[data-skin-set]').forEach((b) => b.addEventListener('click', () => {
  document.documentElement.dataset.skin = b.dataset.skinSet;
  document.querySelectorAll('[data-skin-set]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
}));
bind();
</script>
